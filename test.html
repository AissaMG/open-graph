<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Open Graph</title>
  <!-- Open Graph Metadata -->
  <meta property="og:title" content="Default Title" id="ogTitle">
  <meta property="og:description" content="Default Description" id="ogDescription">
  <meta property="og:url" content="https://centrale-ruddy.vercel.app" id="ogUrl">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://centrale-ruddy.vercel.app/default-image.jpg" id="ogImage">
</head>
<body>
  <h1>Dynamic Open Graph Metadata Example</h1>
  <script>
    // Function to get URL parameters
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      const results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // Update Open Graph metadata
    function updateOpenGraphMetadata() {
      const title = getUrlParameter('title') || 'Default Title';
      const description = getUrlParameter('description') || 'Default Description';
      
      document.getElementById('ogTitle').setAttribute('content', title);
      document.getElementById('ogDescription').setAttribute('content', description);
      document.title = title;  // Update the page title as well
    }

    // Call the function to update metadata
    updateOpenGraphMetadata();
  </script>
</body>
</html>
